{% extends 'base.html' %} {% block title %}Gym Locations{% endblock %} {% block
extra_head %}
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
{% endblock %} {% block content %}
<div class="card">
  <div class="card-header">
    <h2>Gym Locations Map</h2>
  </div>
  <div class="card-body p-0">
    <div id="map" style="height: 600px; width: 100%"></div>
  </div>
</div>
{% endblock %} {% block extra_scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Initialize the map
  var map = L.map('map').setView([27.7172, 85.324], 12);

  // Add OpenStreetMap tiles
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  // Add gym markers (you can add your gym data here)
  {% for gym in gyms %}
  L.marker([{{ gym.latitude }}, {{ gym.longitude }}])
      .addTo(map)
      .bindPopup('<b>{{ gym.name }}</b><br>{{ gym.address }}');
  {% endfor %}
</script>
{% endblock %}
