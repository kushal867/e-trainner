{% extends 'base.html' %} {% block title %}Gym Map{% endblock %} {% block
extra_head %}
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
<style>
  #map {
    height: 500px;
    margin-top: 20px;
    border-radius: 12px;
  }
</style>
{% endblock %} {% block content %}
<h2>Gym Locations Map</h2>
<div id="map"></div>
{% endblock %} {% block extra_scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Default center (Nepal)
  var map = L.map('map').setView([27.7, 85.3], 7);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
  }).addTo(map);

  {% for gym in gyms %}
    L.marker([{{ gym.latitude }}, {{ gym.longitude }}])
      .addTo(map)
      .bindPopup('<b>{{ gym.name }}</b><br>{{ gym.address }}, {{ gym.city }}');
  {% endfor %}
</script>
{% endblock %}
