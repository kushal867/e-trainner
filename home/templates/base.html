<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Gym Finder{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f8f9fa;
        padding-top: 60px;
      }
      nav.navbar {
        background-color: #0d6efd;
      }
      nav a.nav-link,
      .navbar-brand {
        color: white !important;
      }
      footer {
        background: #0d6efd;
        color: white;
        text-align: center;
        padding: 10px 0;
        margin-top: 30px;
      }
    </style>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
      <div class="container">
        <a class="navbar-brand" href="{% url 'gym_list' %}">Gym Finder</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'gym_list' %}">Gyms</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'gym_create' %}">Add Gym</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'gym_location_map' %}">Map</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main content -->
    <main class="container mt-4">{% block content %} {% endblock %}</main>

    <!-- Footer -->
    <footer>
      <p>© 2025 Gym Finder | Built with Django</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
