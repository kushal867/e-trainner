<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Gym Management{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    {% block extra_css %}{% endblock %}
  </head>
  <body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="{% url 'gym_list' %}">🏋️‍♂️ GymFinder</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <div class="ms-auto d-flex">
            <a class="btn btn-outline-light me-2" href="{% url 'gym_list' %}"
              >Gyms</a
            >
            <a
              class="btn btn-outline-light me-2"
              href="{% url 'product_list' %}"
              >Products</a
            >
            <a
              class="btn btn-outline-light me-2"
              href="{% url 'gymReview_list' %}"
              >Reviews</a
            >
            <a class="btn btn-success" href="{% url 'gym_create' %}"
              >+ Add Gym</a
            >
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container">{% block content %}{% endblock %}</div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
