<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Find and explore the best gyms in your area"
    />
    <meta name="keywords" content="gym, fitness, workout, health" />
    <title>{% block title %}Gym Finder{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

    <!-- Custom CSS -->
    <style>
      body {
        font-family: "Inter", sans-serif;
        background: #f9fafb;
        color: #1f2937;
        min-height: 100vh;
        padding-top: 80px;
      }
      .card {
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        border: none;
      }
      nav.navbar {
        background: #fff;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      footer {
        background: #1e40af;
        color: white;
        padding: 40px 0;
        margin-top: auto;
      }
      .navbar-toggler {
        border: none;
        padding: 4px 8px;
      }
      .navbar-toggler:focus {
        box-shadow: none;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      main {
        flex: 1;
      }
    </style>

    {% block extra_head %}{% endblock %}
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'gym_list' %}">
          <i class="bi bi-lightning-charge-fill text-warning"></i> Gym Finder
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <i class="bi bi-list"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'gym_list' %}">
                <i class="bi bi-building"></i> Gyms
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'gym_create' %}">
                <i class="bi bi-plus-circle"></i> Add Gym
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'gym_location_map' %}">
                <i class="bi bi-map"></i> Map
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'product_list' %}">
                <i class="bi bi-bag"></i> Products
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Messages -->
    <div class="container mt-4">
      {% if messages %} {% for message in messages %}
      <div
        class="alert alert-{{ message.tags }} alert-dismissible fade show"
        role="alert"
      >
        {{ message }}
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button>
      </div>
      {% endfor %} {% endif %}
    </div>

    <!-- Main Content -->
    <main class="container mt-4">
      {% block content %}
      <!-- Content will be injected here from child templates -->
      {% endblock %}
    </main>

    <!-- Footer -->
    <footer>
      <div class="container text-center">
        <p class="mb-0">
          © 2025 Gym Finder | Built with
          <i class="bi bi-heart-fill" style="color: #ef4444"></i> using Django
        </p>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- AOS Animation -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      // Initialize AOS
      document.addEventListener("DOMContentLoaded", function () {
        AOS.init({
          duration: 800,
          once: true,
        });
      });
    </script>

    {% block extra_scripts %}{% endblock %}
  </body>
</html>
