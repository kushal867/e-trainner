{% extends 'base.html' %} {% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Gyms</h2>
  <a href="{% url 'gym_create' %}" class="btn btn-primary">+ Add Gym</a>
</div>

<div class="row">
  {% for gym in gyms %}
  <div class="col-md-4 mb-3">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title">{{ gym.name }}</h5>
        <p class="card-text">{{ gym.address }}</p>
        <p><strong>Price:</strong> Rs. {{ gym.price_per_month }}</p>
        <div class="d-flex justify-content-between">
          <a href="{% url 'gym_edit' gym.id %}" class="btn btn-warning btn-sm"
            >Edit</a
          >
          <a href="{% url 'gym_delete' gym.id %}" class="btn btn-danger btn-sm"
            >Delete</a
          >
        </div>
      </div>
    </div>
  </div>
  {% empty %}
  <p>No gyms available.</p>
  {% endfor %}
</div>
{% endblock %}
