{% extends "base.html" %} {% block content %}
<h2 class="mb-3">🏋️ List of Gyms</h2>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Name</th>
      <th>Address</th>
      <th>Price/month</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for gym in gyms %}
    <tr>
      <td>{{ gym.name }}</td>
      <td>{{ gym.address }}</td>
      <td>${{ gym.price_per_month }}</td>
      <td>
        <a href="{% url 'gym_edit' gym.id %}" class="btn btn-sm btn-warning"
          >Edit</a
        >
        <a
          href="{% url 'gym_delete' gym.id %}"
          class="btn btn-sm btn-danger"
          onclick="return confirm('Are you sure you want to delete this gym?');"
        >
          Delete
        </a>
      </td>
    </tr>
    {% empty %}
    <tr>
      <td colspan="4" class="text-center text-muted">No gyms available.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
